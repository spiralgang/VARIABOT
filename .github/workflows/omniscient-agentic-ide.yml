# =============================================================================
# omniscient-agentic-ide.yml  — Omniscient IDE build + agent safety gate
# -----------------------------------------------------------------------------
# SOURCE: ~/dev/OMNISCIENT-Agentic-AI-Sandbox-Mod-L/README.md  (agentic IDE:
#   multi-agent feedback, Gemini thinking budgets, Sovereign Agent Dashboard for
#   agent constraints/sandbox params (memory/CPU), MVVM+Compose, signed APK via
#   KEYSTORE_* secrets).
#
# AGENTIC BEHAVIOR:
#   * Builds the Android APK via the documented signed-release path using
#     ${{ secrets.KEYSTORE_* }} (never inline).
#   * Runs an AGENT SAFETY GATE: calls the REAL LLM to audit the repo for unsafe
#     agent constraints (over-broad sandbox, secret exposure) and emit a verdict.
#   * If the gate flags violations, the build is blocked and a report posted.
#   * Mirrors the "Sovereign Agent Dashboard" constraint-checking in CI.
# =============================================================================
name: "Omniscient ▸ Build + Agent Safety Gate"
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.ZHIPU_API_KEY }}
  LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
  LLM_MODEL: ${{ secrets.LLM_MODEL }}
  ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Decode keystore from secret"
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/key.jks"
            echo "keystore decoded"
          else
            echo "::warning::KEYSTORE_BASE64 not set; signing step will be skipped"
          fi

      - name: "Set up JDK + Android SDK"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "Build release APK (if gradle present)"
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ]; then
            chmod +x gradlew
            if [ -f "$RUNNER_TEMP/key.jks" ]; then
              ./gradlew assembleRelease \
                -PKEYSTORE="$RUNNER_TEMP/key.jks" \
                -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
                -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
                -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
            else
              ./gradlew assembleRelease || echo "unsigned build attempted"
            fi
          else
            echo "no gradlew; skipping android build"
          fi

      - name: "Collect repo sample for the audit"
        id: sample
        shell: bash
        run: |
          set +eo pipefail   # head truncation would otherwise SIGPIPE (exit 141)
          {
            echo "sample<<SAMPLE_EOF_91c"
            {
            echo "Files:"; git ls-files | head -120
            echo; echo "Possible secret patterns (path:line):"
            git grep -nIE '(api[_-]?key|secret|token|passw(or)?d)\s*[:=]\s*["'"'"'][A-Za-z0-9_\-]{16,}' -- . ':!*.md' | cut -c1-160 | head -40 || true
            echo; echo "Agent loops (while True / infinite):"
            git grep -nIE -A6 'while[[:space:]]*[(]?[[:space:]]*(True|true|1)[[:space:]]*[)]?[[:space:]]*[:{]|for [(];;[)]' -- '*.py' '*.js' '*.ts' '*.sh' ':!.next/**' ':!**/node_modules/**' ':!dist/**' ':!build/**' ':!**/*.min.js' | head -30 || true
            echo; echo "Privileged sandbox settings:"
            git grep -nIE 'privileged:[[:space:]]*true|--privileged|/var/run/docker.sock|systemctl ' -- . ':!.github/workflows/omniscient-agentic-ide.yml' ':!*.md' | head -30 || true
            } | head -c 12000
            echo
            echo "SAMPLE_EOF_91c"
          } >> "$GITHUB_OUTPUT"

      - name: "Agent Safety Gate (real LLM audit)"
        id: gate
        uses: ./.github/actions/llm
        with:
          system: "You are the Sovereign Agent safety auditor. Scan the repo for unsafe agent constraints: over-broad sandbox permissions, leaked secrets, unbounded agent loops. The FIRST line of your reply must be exactly 'VERDICT: SAFE' or 'VERDICT: BLOCK'. Only BLOCK for a concrete finding in the evidence provided, citing its exact path:line. NOT violations: interactive REPL/CLI loops with an exit or break, daemons with shutdown handling and sleep, placeholders in .env.example, and app code that merely references docker.sock or systemctl. Violations: real credentials committed to source, autonomous LLM/tool loops with no exit condition or iteration cap, CI/sandbox configs granting privileged/root access to untrusted agent code."
          temperature: "0.2"
          max_tokens: "1000"
          prompt: |
            Audit this repository for agent-safety violations:
            - Any hardcoded secrets/keys/tokens in source?
            - Any agent loop without a max-iteration cap?
            - Any sandbox config granting root/docker/systemd?
            Repository ${{ github.repository }}@${{ github.sha }} evidence:
            ${{ steps.sample.outputs.sample }}

      - name: "Enforce gate"
        if: ${{ steps.gate.outputs.completion != '' }}
        shell: bash
        env:
          VERDICT_TEXT: ${{ steps.gate.outputs.completion }}
          EVIDENCE: ${{ steps.sample.outputs.sample }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERDICT_TEXT" | head -c 3000
          FIRST=$(printf '%s\n' "$VERDICT_TEXT" | grep -m1 -v '^[[:space:]]*$' || true)
          if printf '%s' "$FIRST" | grep -qiE '^[^A-Za-z]*VERDICT:[[:space:]*]*BLOCK'; then
            # Only honour a BLOCK that cites a path:line actually present in the evidence (guards against hallucinated findings).
            VERIFIED=$(python3 -c 'import os,re; v=os.environ["VERDICT_TEXT"]; e=os.environ.get("EVIDENCE",""); refs=set(re.findall(r"([\w./-]+\.\w+):(\d+)", v)); print(sum(1 for p,n in refs if re.search(re.escape(p)+"[:-]"+n+"[:-]", e)))')
            if [ "${VERIFIED:-0}" -gt 0 ]; then
              echo "::error::Agent safety gate BLOCKED the build ($VERIFIED verified finding(s))"; exit 1
            fi
            echo "::warning::Gate said BLOCK but none of its cited path:line findings appear in the evidence; treating as advisory." 
          fi
          echo "agent safety gate: SAFE"
